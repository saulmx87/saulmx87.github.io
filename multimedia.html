<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MexWeb | Cine & Repositorio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradient-xy { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .bg-dynamic { background: linear-gradient(-45deg, #020617, #0f172a, #1e1b4b, #0c4a6e); background-size: 400% 400%; animation: gradient-xy 15s ease infinite; }
        .glass-card { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="bg-dynamic min-h-screen p-4 md:p-6 text-slate-200 font-sans flex flex-col items-center custom-scroll">

    <!-- HEADER BAR -->
    <header class="w-full max-w-7xl mb-6 glass-card p-4 flex justify-between items-center border border-white/5 shadow-2xl">
        <h1 class="text-2xl font-black text-white bg-gradient-to-r from-emerald-400 to-sky-400 bg-clip-text text-transparent">MEXWEB CINE</h1>
        <span class="text-xs font-mono text-slate-400 bg-slate-900/50 px-3 py-1.5 rounded-lg border border-slate-800">files.mexweb.me/peliculas/</span>
    </header>

    <!-- NAVIGATION MENU -->
    <nav class="w-full max-w-7xl mb-6 flex gap-4 text-sm font-bold uppercase tracking-wider">
        <a href="index.html" class="text-slate-400 hover:text-sky-400 transition-colors pb-2 px-1">Radio Hub</a>
        <a href="multimedia.html" class="text-sky-400 border-b-2 border-sky-400 pb-2 px-1">Cine / Películas</a>
        <a href="descargas.html" class="text-slate-400 hover:text-sky-400 transition-colors pb-2 px-1">Portal Descargas</a>
    </nav>

    <!-- DIRECTORY WRAPPER -->
    <main class="w-full max-w-7xl flex-grow flex flex-col">
        <div class="glass-card w-full h-[600px] overflow-hidden relative border border-white/5">
            <iframe 
                src="https://files.mexweb.me/peliculas/" 
                class="absolute top-0 left-0 w-full h-full border-0 custom-scroll"
                allow="autoplay; fullscreen">
            </iframe>
        </div>
    </main>
</body>
</html>
