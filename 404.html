<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Interrupción de Protocolo | MexWeb</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #0f0; font-family: monospace; overflow: hidden; }
        .scanline {
            width: 100%; height: 100px; position: absolute; pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(56,189,248,0.15) 50%, rgba(0,0,0,0) 100%);
            animation: scanline 6s linear infinite;
        }
        @keyframes scanline { 0% { top: -100px; } 100% { top: 100%; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative px-4">
    <div class="scanline"></div>
    <div class="text-center border border-sky-500/20 bg-slate-900/90 p-8 sm:p-12 rounded-2xl shadow-2xl max-w-md w-full">
        <h1 class="text-6xl font-black text-sky-400 mb-2">404</h1>
        <h2 class="text-sm text-white mb-6 uppercase tracking-widest font-bold">Ruta No Encontrada</h2>
        <div class="text-left bg-black/50 p-4 rounded border border-slate-800 text-xs mb-8 text-emerald-400 font-mono">
            <p class="text-slate-500">> Host ping requested...</p>
            <p class="text-red-400">> ERROR: Request Timeout (RTO).</p>
            <p class="text-slate-500">> El recurso no existe en este nodo.</p>
        </div>
        <a href="index.html" class="inline-block bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 px-6 rounded-xl text-sm transition-colors shadow-lg shadow-sky-500/20">
            Regresar al Nodo Principal
        </a>
    </div>
</body>
</html>
